name: Release and Publish

# On every push to main: test, then let semantic-release derive the next version
# from conventional commits (fix → patch, feat → minor, feat! → major), update
# CHANGELOG.md / package.json, tag, create the GitHub Release, and publish to npm
# via OIDC trusted publishing (no NPM_TOKEN secret; provenance is automatic).
# Its release commit carries [skip ci] and is pushed with GITHUB_TOKEN, which
# does not trigger workflows, so this never loops.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false # never kill an in-flight publish

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: node --test build/tests/*.test.js

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write # push the release commit + tag
      issues: write # comment on issues fixed by the release
      pull-requests: write # comment on PRs included in the release
      id-token: write # OIDC token exchanged with npm for a short-lived publish credential
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semantic-release reads all tags and commits since the last release

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never restore caches into a release build

      # Trusted publishing needs npm >= 11.5.1.
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Release with semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0" # no git hooks on the automated release commit
